[project]
name = "mcp-server"
version = "0.1.0"
description = "A standalone local RAG MCP server."
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.9,<2.0",
    "httpx>=0.27,<1.0",
    "langchain-core>=0.3,<1.0",
    "langchain-huggingface>=0.1,<1.0",
    "langchain-openai>=0.3,<1.0",
    "pymilvus>=2.4,<4.0",
    "python-dotenv>=1.0,<2.0",
    "sentence-transformers>=3.0,<6.0",
]

[project.optional-dependencies]
local-embedding = [
    "sentence-transformers>=3.0,<4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
