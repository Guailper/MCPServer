[project]
name = "mcp-server"
version = "0.1.0"
description = "A standalone local RAG MCP server."
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.9,<2.0",
    "httpx>=0.27,<1.0",
    "langchain-core>=0.3,<1.0",
    "langchain-community>=0.3,<1.0",
    "langchain-huggingface>=0.1,<1.0",
    "langchain-openai>=0.3,<1.0",
    "beautifulsoup4>=4.12,<5.0",
    "openpyxl>=3.1,<4.0",
    "pymilvus>=2.5,<4.0",
    "pypdf>=5.0,<7.0",
    "python-docx>=1.1,<2.0",
    "python-dotenv>=1.0,<2.0",
    "ragas>=0.2,<1.0",
    "sentence-transformers>=3.0,<6.0",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.26.0",
]

[project.optional-dependencies]
local-embedding = [
    "sentence-transformers>=3.0,<4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
