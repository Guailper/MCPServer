[project]
name = "mcp-server"
version = "0.1.0"
description = "A standalone local RAG MCP server."
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.9,<2.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
local-embedding = [
    "sentence-transformers>=3.0,<4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
